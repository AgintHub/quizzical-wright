dag_type: typed
description: Generated workflow from UI.
name: clean_professional_shopping_app_design
nodes:
  choose_color_scheme:
    agent: false
    description: Choose a color scheme that aligns with the app's purpose and is consistent
      with the target audience's preferences
    name: choose_color_scheme
    nodes_depended_on:
    - select_layout_style
    nodes_dependent_on: []
    output_structure:
    - description: Human‑readable name of the selected color scheme
      key: color_scheme_name
      type: str
    - description: Hex code of the primary color (e.g., "#FF5733")
      key: primary_color_hex
      type: str
    - description: Hex code of the secondary color
      key: secondary_color_hex
      type: str
    - description: Hex code of the accent color
      key: accent_color_hex
      type: str
    - description: List of hex codes representing the full color palette
      key: color_palette
      type: List[str]
    - description: Contrast ratio rating (WCAG) for the primary and secondary colors
      key: color_contrast_rating
      type: float
    - description: Whether the selected scheme meets accessibility and branding criteria
      key: is_color_scheme_valid
      type: bool
    prompt: Select a color scheme that reflects the app's personality and style
  choose_imagery_style:
    agent: false
    description: Choose an imagery style that reflects the app's personality and is
      consistent with the target audience's preferences
    name: choose_imagery_style
    nodes_depended_on:
    - select_layout_style
    nodes_dependent_on: []
    output_structure:
    - description: Name of the selected imagery style (e.g., 'modern minimalistic',
        'vibrant lifestyle')
      key: imagery_style
      type: str
    - description: Brief description of the imagery style and its visual characteristics
      key: style_description
      type: str
    - description: List of visual categories or themes that fit the selected style
        (e.g., 'product close-ups', 'lifestyle shots')
      key: style_categories
      type: List[str]
    - description: Whether the selected style aligns with the target audience's preferences
      key: target_audience_consistency
      type: bool
    - description: Estimated number of image assets needed to cover the app's features
      key: recommended_image_count
      type: int
    prompt: Select an imagery style that aligns with the app's visual style and target
      audience
  create_asset_library:
    agent: false
    description: Create a diverse library of images and graphics that align with the
      app's style and purpose
    name: create_asset_library
    nodes_depended_on:
    - choose_color_scheme
    - choose_imagery_style
    nodes_dependent_on: []
    output_structure:
    - description: Names of the assets in the library.
      key: asset_names
      type: List[str]
    - description: Types of assets (e.g., illustration, icon, photo).
      key: asset_types
      type: List[str]
    - description: Brief descriptions of each asset.
      key: asset_descriptions
      type: List[str]
    - description: Public URLs where each asset can be accessed.
      key: asset_urls
      type: List[str]
    - description: Style tags that describe the visual style of the assets.
      key: style_tags
      type: List[str]
    - description: Total number of assets created.
      key: total_assets
      type: int
    prompt: Develop a library of images and graphics for the app
  create_high-fidelity_prototype:
    agent: false
    description: Develop a detailed, interactive prototype of the app that includes
      all features and functions
    name: create_high-fidelity_prototype
    nodes_depended_on:
    - decide_navigation_structure
    nodes_dependent_on: []
    output_structure:
    - description: File path or URL where the prototype is stored
      key: prototype_file_path
      type: str
    - description: Whether the prototype supports interactive navigation
      key: prototype_interactive
      type: bool
    - description: Number of distinct features implemented in the prototype
      key: prototype_features_count
      type: int
    - description: Overall quality rating of the prototype on a scale from 0.0 to
        1.0
      key: prototype_quality_score
      type: float
    - description: List of identified issues or bugs in the prototype
      key: prototype_issues_found
      type: List[str]
    - description: Number of test cases that passed successfully
      key: prototype_test_cases_passed
      type: int
    - description: Total number of test cases executed
      key: prototype_test_cases_total
      type: int
    - description: Estimated time in hours to complete the prototype
      key: prototype_time_estimate_hours
      type: float
    prompt: Create a detailed, interactive prototype of the app
  create_sitemap:
    agent: false
    description: Map out the app's content and features to ensure a logical and easy-to-use
      structure
    name: create_sitemap
    nodes_depended_on:
    - define_app_purpose
    nodes_dependent_on: []
    output_structure:
    - description: Names of the top-level sections in the sitemap.
      key: section_names
      type: List[str]
    - description: Total number of sections in the sitemap.
      key: section_count
      type: int
    - description: Whether the sitemap follows a logical and easy-to-use structure.
      key: is_valid_structure
      type: bool
    - description: List of primary pages directly under the root section.
      key: primary_pages
      type: List[str]
    prompt: Create a detailed sitemap that outlines the app's content and features
  create_typography_guide:
    agent: false
    description: Develop a guide for using the chosen typography system to maintain
      consistency throughout the app
    name: create_typography_guide
    nodes_depended_on:
    - select_typography
    nodes_dependent_on: []
    output_structure:
    - description: Name of the selected typography system.
      key: typography_system_name
      type: str
    - description: List of font families recommended for headings, body, and other
        text elements.
      key: font_families
      type: List[str]
    - description: Guidelines for heading styles (e.g., H1, H2) including size, weight,
        and line height.
      key: heading_styles
      type: List[str]
    - description: Guidelines for body text styles including size, weight, and line
        height.
      key: body_text_styles
      type: List[str]
    - description: Recommended line spacing (leading) for body text.
      key: line_spacing
      type: float
    - description: Recommended paragraph spacing (margin) between blocks of text.
      key: paragraph_spacing
      type: float
    - description: Sample uses of typography styles in UI components.
      key: usage_examples
      type: List[str]
    - description: Whether the guide ensures consistency across the app.
      key: is_consistent
      type: bool
    prompt: Create a detailed guide for using the chosen typography system
  decide_navigation_structure:
    agent: false
    description: Determine the hierarchy of the app's features and how they will be
      organized
    name: decide_navigation_structure
    nodes_depended_on:
    - select_layout_style
    - create_sitemap
    nodes_dependent_on: []
    output_structure:
    - description: Names of top-level navigation sections
      key: nav_items
      type: List[str]
    - description: Maximum depth of the navigation hierarchy
      key: nav_hierarchy_depth
      type: int
    - description: Display labels for each navigation item
      key: nav_labels
      type: List[str]
    - description: Link identifiers (e.g., route names) for each navigation item
      key: nav_links
      type: List[str]
    - description: Brief description of the overall navigation structure
      key: nav_overview
      type: str
    prompt: Design an intuitive navigation system for the app
  define_app_purpose:
    agent: false
    description: Determine the app's main functionality and features
    name: define_app_purpose
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: High-level purpose of the shopping app, e.g., 'to provide a seamless
        online shopping experience for fashion items'
      key: app_purpose
      type: str
    - description: List of core features that the app must include, e.g., 'product
        catalog', 'shopping cart', 'checkout', 'user reviews'
      key: core_features
      type: List[str]
    - description: Primary user demographic or market segment the app targets
      key: target_audience
      type: str
    - description: Key business objectives the app aims to achieve, e.g., 'increase
        conversion rate', 'reduce cart abandonment'
      key: business_goals
      type: List[str]
    prompt: Define the shopping app's purpose and core features
  refine_app_icons:
    agent: false
    description: Refine the app's icons and logos to ensure they are consistent with
      the app's style and purpose
    name: refine_app_icons
    nodes_depended_on:
    - create_asset_library
    nodes_dependent_on: []
    output_structure:
    - description: List of file paths or URLs to the refined icon assets
      key: refined_icon_files
      type: List[str]
    - description: List of file paths or URLs to the refined logo assets
      key: refined_logo_files
      type: List[str]
    - description: A score between 0 and 1 indicating how well the refined assets
        align with the defined style guidelines
      key: compliance_score
      type: float
    - description: True if the refined assets meet the quality threshold, otherwise
        False
      key: output_quality
      type: bool
    prompt: Design high-quality icons and logos that reflect the app's style and personality
  select_layout_style:
    agent: false
    description: Choose a visual style that reflects the app's personality and is
      consistent with the target audience's preferences
    name: select_layout_style
    nodes_depended_on:
    - define_app_purpose
    nodes_dependent_on: []
    output_structure:
    - description: The name or title of the selected layout style
      key: layout_style_name
      type: str
    - description: A brief description of the visual characteristics of the layout
        style
      key: layout_style_description
      type: str
    - description: The primary user group or demographic that the layout style is
        designed for
      key: target_audience
      type: str
    - description: A list of color names or hex codes that complement the chosen layout
        style
      key: recommended_color_palette
      type: List[str]
    - description: The typography system (e.g., font family, weight hierarchy) that
        aligns with the layout style
      key: recommended_typography_system
      type: str
    - description: The grid system (e.g., columns, gutters, breakpoints) used to arrange
        UI elements in the layout
      key: layout_grid_structure
      type: str
    prompt: Select a layout style that aligns with the app's purpose and target audience
  select_typography:
    agent: false
    description: Choose a typography system that reflects the app's visual style and
      is consistent with the target audience's preferences
    name: select_typography
    nodes_depended_on:
    - select_layout_style
    nodes_dependent_on: []
    output_structure:
    - description: Primary font family selected for the app
      key: typography_family
      type: str
    - description: List of font weights (e.g., regular, bold) used
      key: font_weights
      type: List[str]
    - description: Base font size in pixels
      key: base_font_size
      type: int
    - description: Line height multiplier for body text
      key: line_height
      type: float
    - description: True if the selected typography is serif, False otherwise
      key: is_serif
      type: bool
    - description: List of fallback font families
      key: fallback_fonts
      type: List[str]
    prompt: Select a typography system that aligns with the app's style
