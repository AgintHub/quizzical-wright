dag_type: typed
description: Generated workflow from UI.
name: clean_professional_shopping_app_design
nodes:
  choose_color_scheme:
    agent: false
    description: Choose a color scheme that aligns with the app's purpose and is consistent
      with the target audience's preferences
    name: choose_color_scheme
    nodes_depended_on:
    - select_layout_style
    nodes_dependent_on: []
    output_structure:
    - description: Name of the chosen color scheme that aligns with the app's personality
        and target audience.
      key: selected_color_scheme
      type: str
    - description: List of hex codes or color names representing the full palette
        for the scheme.
      key: color_palette
      type: List[str]
    - description: Primary color used for main UI elements.
      key: primary_color
      type: str
    - description: Secondary color used for accents and highlights.
      key: secondary_color
      type: str
    - description: Numerical score (0-1) indicating contrast compliance with accessibility
        guidelines.
      key: color_contrast_score
      type: float
    - description: Whether the selected scheme meets all design constraints.
      key: is_valid_scheme
      type: bool
    prompt: Select a color scheme that reflects the app's personality and style
  choose_imagery_style:
    agent: false
    description: Choose an imagery style that reflects the app's personality and is
      consistent with the target audience's preferences
    name: choose_imagery_style
    nodes_depended_on:
    - select_layout_style
    nodes_dependent_on: []
    output_structure:
    - description: The name of the selected imagery style (e.g., 'minimalist', 'illustrative',
        'photorealistic')
      key: imagery_style_name
      type: str
    - description: A brief description of the selected imagery style and its visual
        characteristics
      key: imagery_style_description
      type: str
    - description: A list of example image categories or themes that exemplify the
        chosen style (e.g., 'product shots', 'lifestyle scenes', 'icons')
      key: example_image_categories
      type: List[str]
    - description: Whether the chosen imagery style is considered suitable for the
        target audience based on their preferences
      key: is_suitable_for_audience
      type: bool
    prompt: Select an imagery style that aligns with the app's visual style and target
      audience
  create_asset_library:
    agent: false
    description: Create a diverse library of images and graphics that align with the
      app's style and purpose
    name: create_asset_library
    nodes_depended_on:
    - choose_color_scheme
    - choose_imagery_style
    nodes_dependent_on: []
    output_structure:
    - description: URLs of the images in the library
      key: image_urls
      type: List[str]
    - description: Identifiers of graphics in the library
      key: graphic_ids
      type: List[int]
    - description: Total number of images in the library
      key: total_images
      type: int
    - description: Total number of graphics in the library
      key: total_graphics
      type: int
    - description: Whether the library meets the required completeness criteria
      key: is_complete
      type: bool
    prompt: Develop a library of images and graphics for the app
  create_high-fidelity_prototype:
    agent: false
    description: Develop a detailed, interactive prototype of the app that includes
      all features and functions
    name: create_high-fidelity_prototype
    nodes_depended_on:
    - decide_navigation_structure
    nodes_dependent_on: []
    output_structure:
    - description: File path or URL where the prototype is stored.
      key: prototype_file_path
      type: str
    - description: Brief summary of the prototype's layout and functionality.
      key: prototype_summary
      type: str
    - description: List of key features included in the prototype.
      key: feature_list
      type: List[str]
    - description: Score (0-1) representing how interactive the prototype is.
      key: interactivity_score
      type: float
    - description: List of test cases or scenarios used to validate the prototype.
      key: test_cases
      type: List[str]
    - description: Whether the prototype meets all design specifications.
      key: is_valid
      type: bool
    prompt: Create a detailed, interactive prototype of the app
  create_sitemap:
    agent: false
    description: Map out the app's content and features to ensure a logical and easy-to-use
      structure
    name: create_sitemap
    nodes_depended_on:
    - define_app_purpose
    nodes_dependent_on: []
    output_structure:
    - description: List of page identifiers (e.g., Home, Category, Product, Cart,
        Checkout).
      key: page_list
      type: List[str]
    - description: List of core features included in the app (e.g., Search, Filter,
        Wishlist).
      key: feature_list
      type: List[str]
    - description: Maximum depth of navigation hierarchy.
      key: navigation_depth
      type: int
    - description: Whether the sitemap adheres to best practices.
      key: is_valid_structure
      type: bool
    prompt: Create a detailed sitemap that outlines the app's content and features
  create_typography_guide:
    agent: false
    description: Develop a guide for using the chosen typography system to maintain
      consistency throughout the app
    name: create_typography_guide
    nodes_depended_on:
    - select_typography
    nodes_dependent_on: []
    output_structure:
    - description: Name of the typography system selected
      key: typography_system_name
      type: str
    - description: List of font families used in the app
      key: font_families
      type: List[str]
    - description: Guidelines for heading styles (e.g., H1, H2, H3)
      key: heading_style
      type: str
    - description: Guidelines for body text style (e.g., paragraph, caption)
      key: body_style
      type: str
    - description: Colors used for typography elements
      key: color_palette
      type: List[str]
    - description: Sample usage examples for headings and body text
      key: usage_examples
      type: List[str]
    prompt: Create a detailed guide for using the chosen typography system
  decide_navigation_structure:
    agent: false
    description: Determine the hierarchy of the app's features and how they will be
      organized
    name: decide_navigation_structure
    nodes_depended_on:
    - select_layout_style
    - create_sitemap
    nodes_dependent_on: []
    output_structure:
    - description: Top‑level sections or categories in the navigation menu
      key: navigation_sections
      type: List[str]
    - description: Submenu items under each top‑level section, listed in the order
        they appear
      key: submenu_items
      type: List[str]
    - description: Maximum depth of the navigation hierarchy (e.g., 2 for top‑level
        and one submenu level)
      key: navigation_depth
      type: int
    - description: Whether the proposed navigation structure is intuitive for the
        target audience
      key: is_intuitive_design
      type: bool
    prompt: Design an intuitive navigation system for the app
  define_app_purpose:
    agent: false
    description: Determine the app's main functionality and features
    name: define_app_purpose
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Overall purpose or main function of the app
      key: primary_functionality
      type: str
    - description: Primary features and functionalities of the app
      key: core_features
      type: List[str]
    - description: Typical user demographic or persona targeted by the app
      key: target_user_group
      type: str
    prompt: Define the shopping app's purpose and core features
  refine_app_icons:
    agent: false
    description: Refine the app's icons and logos to ensure they are consistent with
      the app's style and purpose
    name: refine_app_icons
    nodes_depended_on:
    - create_asset_library
    nodes_dependent_on: []
    output_structure:
    - description: File paths or identifiers for the refined icons.
      key: refined_icon_paths
      type: List[str]
    - description: File paths or identifiers for the refined logos.
      key: refined_logo_paths
      type: List[str]
    - description: Average quality score of the refined icons ranging from 0 to 1.
      key: icon_quality_score
      type: float
    - description: Average quality score of the refined logos ranging from 0 to 1.
      key: logo_quality_score
      type: float
    - description: Whether the refined icons are consistent with the app's style.
      key: icons_consistent_with_style
      type: bool
    - description: Whether the refined logos are consistent with the app's style.
      key: logos_consistent_with_style
      type: bool
    prompt: Design high-quality icons and logos that reflect the app's style and personality
  select_layout_style:
    agent: false
    description: Choose a visual style that reflects the app's personality and is
      consistent with the target audience's preferences
    name: select_layout_style
    nodes_depended_on:
    - define_app_purpose
    nodes_dependent_on: []
    output_structure:
    - description: Name of the selected layout style (e.g., 'Minimalist', 'Bold',
        'Playful')
      key: layout_style_name
      type: str
    - description: Brief description of the visual characteristics of the chosen layout
        style
      key: layout_style_description
      type: str
    - description: Primary demographic or user group that the layout style is designed
        to appeal to
      key: target_audience
      type: str
    - description: Suggested color palette that complements the chosen layout style
      key: recommended_color_scheme
      type: str
    - description: Key design principles (e.g., 'simplicity', 'clarity', 'contrast')
        that guide the layout
      key: design_principles
      type: List[str]
    - description: A score between 0.0 and 1.0 indicating how well the layout style
        aligns with the app's purpose and target audience
      key: consistency_score
      type: float
    prompt: Select a layout style that aligns with the app's purpose and target audience
  select_typography:
    agent: false
    description: Choose a typography system that reflects the app's visual style and
      is consistent with the target audience's preferences
    name: select_typography
    nodes_depended_on:
    - select_layout_style
    nodes_dependent_on: []
    output_structure:
    - description: Name of the chosen typography system.
      key: typography_name
      type: str
    - description: Primary font family used in the app.
      key: primary_font_family
      type: str
    - description: Secondary font family used for accents or headings.
      key: secondary_font_family
      type: str
    - description: Base font size in pixels.
      key: base_font_size
      type: int
    - description: Line height multiplier for body text.
      key: line_height
      type: float
    - description: List of font weight values supported by the typography system.
      key: font_weights
      type: List[int]
    - description: List of color hex codes used for typography elements.
      key: color_palette
      type: List[str]
    prompt: Select a typography system that aligns with the app's style
