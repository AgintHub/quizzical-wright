dag_type: typed
description: Generated workflow from UI.
name: clean_professional_shopping_app_design
nodes:
  choose_color_scheme:
    agent: false
    description: Choose a color scheme that aligns with the app's purpose and is consistent
      with the target audience's preferences
    name: choose_color_scheme
    nodes_depended_on:
    - select_layout_style
    nodes_dependent_on: []
    output_structure:
    - description: Human‑readable name of the selected color scheme (e.g., 'Vibrant
        Summer', 'Minimalist Night')
      key: color_scheme_name
      type: str
    - description: Hex code of the primary color used throughout the app (e.g., '#FF5733')
      key: primary_color_hex
      type: str
    - description: Hex code of the secondary color used for accents and highlights
      key: secondary_color_hex
      type: str
    - description: Hex code of the accent color used sparingly for calls‑to‑action
        or emphasis
      key: accent_color_hex
      type: str
    - description: List of any additional hex color codes that complement the main
        scheme (optional)
      key: additional_colors_hex
      type: List[str]
    - description: Flag indicating whether the chosen scheme meets the app's visual
        guidelines and accessibility requirements
      key: is_valid
      type: bool
    prompt: Select a color scheme that reflects the app's personality and style
  choose_imagery_style:
    agent: false
    description: Choose an imagery style that reflects the app's personality and is
      consistent with the target audience's preferences
    name: choose_imagery_style
    nodes_depended_on:
    - select_layout_style
    nodes_dependent_on: []
    output_structure:
    - description: Selected imagery style that aligns with the app's visual style
        and target audience
      key: imagery_style
      type: str
    prompt: Select an imagery style that aligns with the app's visual style and target
      audience
  create_asset_library:
    agent: false
    description: Create a diverse library of images and graphics that align with the
      app's style and purpose
    name: create_asset_library
    nodes_depended_on:
    - choose_color_scheme
    - choose_imagery_style
    nodes_dependent_on: []
    output_structure:
    - description: Name of the asset library
      key: library_name
      type: str
    - description: Number of images included in the library
      key: total_images
      type: int
    - description: Number of graphic assets included in the library
      key: total_graphics
      type: int
    - description: List of image file formats used (e.g., png, jpg, svg)
      key: image_formats
      type: List[str]
    - description: List of graphic file formats used (e.g., svg, ai, eps)
      key: graphic_formats
      type: List[str]
    - description: Score (0 to 1) indicating how well the library aligns with the
        chosen color scheme and imagery style
      key: theme_alignment_score
      type: float
    - description: Brief textual description of the library contents
      key: description
      type: str
    prompt: Develop a library of images and graphics for the app
  create_high-fidelity_prototype:
    agent: false
    description: Develop a detailed, interactive prototype of the app that includes
      all features and functions
    name: create_high-fidelity_prototype
    nodes_depended_on:
    - decide_navigation_structure
    nodes_dependent_on: []
    output_structure:
    - description: File system path or URL where the prototype file is stored
      key: prototype_file_path
      type: str
    - description: Brief textual description summarizing the prototype’s purpose and
        scope
      key: prototype_description
      type: str
    - description: List of all key features implemented in the prototype
      key: prototype_features_list
      type: List[str]
    - description: Total number of interactive elements (e.g., buttons, links) in
        the prototype
      key: prototype_interactions_count
      type: int
    - description: Estimated quality score of the prototype on a scale of 0.0 to 1.0
      key: prototype_quality_score
      type: float
    - description: Indicates whether the prototype supports full interactive functionality
      key: is_interactive
      type: bool
    prompt: Create a detailed, interactive prototype of the app
  create_sitemap:
    agent: false
    description: Map out the app's content and features to ensure a logical and easy-to-use
      structure
    name: create_sitemap
    nodes_depended_on:
    - define_app_purpose
    nodes_dependent_on: []
    output_structure:
    - description: List of all page names in the sitemap.
      key: page_list
      type: List[str]
    - description: Hierarchical representation of pages, each string showing the path
        from root to the page (e.g., 'Home > Products > Product Detail').
      key: page_hierarchy
      type: List[str]
    - description: Total number of pages in the sitemap.
      key: total_pages
      type: int
    - description: Whether the sitemap follows a logical and easy-to-use structure.
      key: is_valid_structure
      type: bool
    - description: List of main features or sections represented in the sitemap.
      key: main_features
      type: List[str]
    prompt: Create a detailed sitemap that outlines the app's content and features
  create_typography_guide:
    agent: false
    description: Develop a guide for using the chosen typography system to maintain
      consistency throughout the app
    name: create_typography_guide
    nodes_depended_on:
    - select_typography
    nodes_dependent_on: []
    output_structure:
    - description: The title of the typography guide
      key: guide_name
      type: str
    - description: List of font families designated for heading styles
      key: heading_font_families
      type: List[str]
    - description: List of font families designated for body text
      key: body_font_families
      type: List[str]
    - description: Names of heading styles (e.g., H1, H2, H3) defined in the guide
      key: heading_styles
      type: List[str]
    - description: Names of body text styles (e.g., paragraph, caption, button) defined
        in the guide
      key: body_styles
      type: List[str]
    - description: Hex codes or color names used for text, links, and accents
      key: color_palette_for_typography
      type: List[str]
    - description: Guidelines for line height, letter spacing, and paragraph spacing
      key: spacing_guidelines
      type: str
    - description: Sample code snippets or visual examples showing the typography
        applied
      key: usage_examples
      type: str
    prompt: Create a detailed guide for using the chosen typography system
  decide_navigation_structure:
    agent: false
    description: Determine the hierarchy of the app's features and how they will be
      organized
    name: decide_navigation_structure
    nodes_depended_on:
    - select_layout_style
    - create_sitemap
    nodes_dependent_on: []
    output_structure:
    - description: List of top-level navigation sections in the app
      key: top_level_sections
      type: List[str]
    - description: List of sub-navigation items grouped under each top-level section
      key: sub_navigation_items
      type: List[str]
    - description: Maximum depth of the navigation hierarchy (e.g., 2 for top-level
        + one sub-level)
      key: navigation_depth
      type: int
    - description: Guiding principles or rules applied to the navigation design
      key: navigation_principles
      type: List[str]
    prompt: Design an intuitive navigation system for the app
  define_app_purpose:
    agent: false
    description: Determine the app's main functionality and features
    name: define_app_purpose
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: A concise statement of the app's primary purpose
      key: purpose
      type: str
    - description: A list of the main functional features the app will provide
      key: core_features
      type: List[str]
    - description: A description of the primary user group the app is designed for
      key: target_audience
      type: str
    - description: The revenue or monetization strategy for the app
      key: business_model
      type: str
    prompt: Define the shopping app's purpose and core features
  refine_app_icons:
    agent: false
    description: Refine the app's icons and logos to ensure they are consistent with
      the app's style and purpose
    name: refine_app_icons
    nodes_depended_on:
    - create_asset_library
    nodes_dependent_on: []
    output_structure:
    - description: List of filenames for the refined icons
      key: refined_icon_filenames
      type: List[str]
    - description: List of filenames for the refined logos
      key: refined_logo_filenames
      type: List[str]
    - description: True if all icons were refined successfully
      key: icon_refinement_success
      type: bool
    - description: True if all logos were refined successfully
      key: logo_refinement_success
      type: bool
    - description: Total number of assets (icons + logos) refined
      key: total_refined_assets
      type: int
    prompt: Design high-quality icons and logos that reflect the app's style and personality
  select_layout_style:
    agent: false
    description: Choose a visual style that reflects the app's personality and is
      consistent with the target audience's preferences
    name: select_layout_style
    nodes_depended_on:
    - define_app_purpose
    nodes_dependent_on: []
    output_structure:
    - description: Name of the selected layout style.
      key: layout_style
      type: str
    - description: Brief description of the selected layout style.
      key: layout_style_description
      type: str
    - description: Score (0-1) indicating how well the selected layout matches the
        target audience preferences.
      key: audience_match_score
      type: float
    - description: List of alternative layout styles considered.
      key: alternative_layouts
      type: List[str]
    prompt: Select a layout style that aligns with the app's purpose and target audience
  select_typography:
    agent: false
    description: Choose a typography system that reflects the app's visual style and
      is consistent with the target audience's preferences
    name: select_typography
    nodes_depended_on:
    - select_layout_style
    nodes_dependent_on: []
    output_structure:
    - description: Primary typeface family selected for the app.
      key: typography_family
      type: str
    - description: List of font weights (e.g., 'regular', 'bold', 'semibold') used
        in the typography system.
      key: font_weights
      type: List[str]
    - description: Recommended line-height factor relative to font size.
      key: line_height
      type: float
    - description: Minimum and maximum font sizes (in pixels) used across the app.
      key: font_size_range
      type: List[int]
    - description: Default letter spacing (in em) for body text.
      key: letter_spacing
      type: float
    - description: Sample text styles (e.g., 'h1', 'body', 'caption') with their corresponding
        font size and weight.
      key: text_style_examples
      type: List[str]
    prompt: Select a typography system that aligns with the app's style
