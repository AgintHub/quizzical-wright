nodes:
  add_payment_integration:
    agent: false
    code_node_type: stub
    description: Integrate a suitable payment gateway into the shopping app.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass WriteProductListingLogicOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for write_product_listing_logic node outputs.\"\"\"\n    product_list: List[str]\
      \ = Field(..., description=\"List of product names\")\n    product_descriptions:\
      \ List[str] = (\n        Field(..., description=\"List of product descriptions\"\
      )\n    )\n    product_prices: List[float] = (\n        Field(..., description=\"\
      List of product prices\")\n    )\n    is_product_listing_successful: bool =\
      \ (\n        Field(..., description=\"Whether the product listing logic was\
      \ successfully implemented\")\n    )\n\n\nclass AddPaymentIntegrationOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for add_payment_integration node outputs.\"\"\"\n\
      \    payment_gateway: str = (\n        Field(..., description=\"The name of\
      \ the integrated payment gateway\")\n    )\n    transaction_processing_status:\
      \ bool = (\n        Field(..., description=\"Whether the transaction processing\
      \ logic has been successfully implemented\")\n    )\n    receipt_generation_status:\
      \ bool = (\n        Field(..., description=\"Whether the receipt generation\
      \ logic has been successfully implemented\")\n    )\n    supported_payment_methods:\
      \ List[str] = (\n        Field(..., description=\"List of supported payment\
      \ methods (e.g., credit card, PayPal, etc.)\")\n    )\n\n\ndef add_payment_integration(write_product_listing_logic_input:\
      \ WriteProductListingLogicOutput, **kwargs) -> AddPaymentIntegrationOutput:\n\
      \    \"\"\"\n    Integrate a payment gateway into the shopping app and return\
      \ integration\n    status.\n\n    Returns\n    -------\n    dict\n        A\
      \ dictionary containing the payment gateway name, boolean flags for\n      \
      \  transaction processing and receipt generation success, and a list of\n  \
      \      supported payment methods.\n\n    Raises\n    ------\n    ValueError\n\
      \        Raised if the payment gateway configuration is missing or invalid.\n\
      \n    Examples\n    --------\n    >>> result = add_payment_integration()\n \
      \   {\n      \"payment_gateway\": \"Stripe\",\n      \"transaction_processing_status\"\
      : true,\n      \"receipt_generation_status\": true,\n      \"supported_payment_methods\"\
      : [\"credit_card\", \"debit_card\", \"paypal\"]\n    }\n\n    >>> result = add_payment_integration()\n\
      \    {\n      \"payment_gateway\": \"PayPal\",\n      \"transaction_processing_status\"\
      : true,\n      \"receipt_generation_status\": false,\n      \"supported_payment_methods\"\
      : [\"paypal\", \"credit_card\"]\n    }\n\n    \"\"\"\n    return AddPaymentIntegrationOutput(\n\
      \        payment_gateway=\"\",\n        transaction_processing_status=False,\n\
      \        receipt_generation_status=False,\n        supported_payment_methods=[],\n\
      \    )"
    name: add_payment_integration
    nodes_depended_on:
    - write_product_listing_logic
    nodes_dependent_on: []
    output_structure:
    - description: The name of the integrated payment gateway
      key: payment_gateway
      type: str
    - description: Whether the transaction processing logic has been successfully
        implemented
      key: transaction_processing_status
      type: bool
    - description: Whether the receipt generation logic has been successfully implemented
      key: receipt_generation_status
      type: bool
    - description: List of supported payment methods (e.g., credit card, PayPal, etc.)
      key: supported_payment_methods
      type: List[str]
    prd:
      conceptual_info: This node integrates a payment gateway (e.g., Stripe or PayPal)
        into the shopping app, implementing transaction processing and receipt generation
        logic.
      docstring:
        examples:
        - lines:
          - result = add_payment_integration()
          output: "{\n  \"payment_gateway\": \"Stripe\",\n  \"transaction_processing_status\"\
            : true,\n  \"receipt_generation_status\": true,\n  \"supported_payment_methods\"\
            : [\"credit_card\", \"debit_card\", \"paypal\"]\n}"
        - lines:
          - result = add_payment_integration()
          output: "{\n  \"payment_gateway\": \"PayPal\",\n  \"transaction_processing_status\"\
            : true,\n  \"receipt_generation_status\": false,\n  \"supported_payment_methods\"\
            : [\"paypal\", \"credit_card\"]\n}"
        parameters: []
        raises:
        - description: Raised if the payment gateway configuration is missing or invalid.
          type: ValueError
        returns:
          description: A dictionary containing the payment gateway name, boolean flags
            for transaction processing and receipt generation success, and a list
            of supported payment methods.
          type: dict
        summary: Integrate a payment gateway into the shopping app and return integration
          status.
    prompt: Add payment integration using a suitable payment gateway (e.g., Stripe,
      PayPal). Focus on implementing the necessary logic for processing transactions
      and sending receipts.
    shims: []
  choose_framework:
    agent: false
    code_node_type: stub
    description: Select a suitable tech stack and framework for the shopping app.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass PlanShoppingAppFeaturesOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for plan_shopping_app_features node outputs.\"\"\"\n    essential_features:\
      \ List[str] = (\n        Field(..., description=\"List of must-have features\
      \ for a basic shopping app\")\n    )\n    feature_count: int = (\n        Field(...,\
      \ description=\"Total number of essential features\")\n    )\n\n\nclass ChooseFrameworkOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for choose_framework node outputs.\"\"\"\n    tech_stack:\
      \ str = (\n        Field(..., description=\"The chosen tech stack for the shopping\
      \ app (e.g., React Native, Flutter)\")\n    )\n    framework: str = (\n    \
      \    Field(..., description=\"The chosen framework for the shopping app\")\n\
      \    )\n    justification: str = (\n        Field(..., description=\"A 2-sentence\
      \ justification for the chosen tech stack and framework\")\n    )\n\n\ndef choose_framework(plan_shopping_app_features_input:\
      \ PlanShoppingAppFeaturesOutput, **kwargs) -> ChooseFrameworkOutput:\n    \"\
      \"\"\n    Selects a suitable tech stack and framework for the shopping app based\
      \ on\n    the provided features.\n\n    Parameters\n    ----------\n    essential_features\
      \ : List[str]\n        List of essential features for the shopping app\n\n \
      \   Returns\n    -------\n    dict\n        A dictionary containing the chosen\
      \ tech stack, framework, and\n        justification\n\n    Raises\n    ------\n\
      \    ValueError\n        If the input features are empty or invalid\n\n    Examples\n\
      \    --------\n    >>> choose_framework(essential_features=[\"product listing\"\
      , \"search\",\n    \"filter\"])\n    >>> print(output['tech_stack'])  # Output:\
      \ 'React Native'\n    >>> print(output['framework'])  # Output: 'React'\n  \
      \  >>> print(output['justification'])  # Output: 'React Native is chosen for\n\
      \    its cross-platform compatibility and React for its simplicity.'\n    {'tech_stack':\
      \ 'React Native', 'framework': 'React', 'justification': 'React\n    Native\
      \ is chosen for its cross-platform compatibility and React for its\n    simplicity.'}\n\
      \n    \"\"\"\n    return ChooseFrameworkOutput(\n        tech_stack=\"\",\n\
      \        framework=\"\",\n        justification=\"\",\n    )"
    name: choose_framework
    nodes_depended_on:
    - plan_shopping_app_features
    nodes_dependent_on: []
    output_structure:
    - description: The chosen tech stack for the shopping app (e.g., React Native,
        Flutter)
      key: tech_stack
      type: str
    - description: The chosen framework for the shopping app
      key: framework
      type: str
    - description: A 2-sentence justification for the chosen tech stack and framework
      key: justification
      type: str
    prd:
      conceptual_info: This node is responsible for choosing a suitable tech stack
        and framework for the shopping app based on the identified features.
      docstring:
        examples:
        - lines:
          - choose_framework(essential_features=["product listing", "search", "filter"])
          - 'print(output[''tech_stack''])  # Output: ''React Native'''
          - 'print(output[''framework''])  # Output: ''React'''
          - 'print(output[''justification''])  # Output: ''React Native is chosen
            for its cross-platform compatibility and React for its simplicity.'''
          output: '{''tech_stack'': ''React Native'', ''framework'': ''React'', ''justification'':
            ''React Native is chosen for its cross-platform compatibility and React
            for its simplicity.''}'
        parameters:
        - description: List of essential features for the shopping app
          name: essential_features
          type: List[str]
        raises:
        - description: If the input features are empty or invalid
          type: ValueError
        returns:
          description: A dictionary containing the chosen tech stack, framework, and
            justification
          type: dict
        summary: Selects a suitable tech stack and framework for the shopping app
          based on the provided features.
    prompt: Based on the identified features, select and specify a suitable tech stack
      (e.g., React Native, Flutter) and framework for building the shopping app. Provide
      a 2-sentence justification.
    shims: []
  create_ui_component:
